<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 5 - Volunteer Form</title>
</head>
<body>
  <h1>Volunteer Form</h1>

  <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">

    <fieldset>
      <legend>My Info</legend>

      <label for="first_name_field">first name:</label>
      <input type="text" id="first_name_field" name="first_name_field"><br>

      <label for="last_name_field">last name:</label>
      <input type="text" id="last_name_field" name="last_name_field"><br>

      <label for="phone_field">phone:</label>
      <input type="text" id="phone_field" name="phone_field"><br>

      <label for="email_field">email:</label>
      <input type="text" id="email_field" name="email_field"><br>

      Gender:<br>
      <label for="gender_male">Male</label>
      <input type="radio" id="gender_male" name="gender_field" value="male">
      <label for="gender_female">Female</label>
      <input type="radio" id="gender_female" name="gender_field" value="female"><br>

      <label for="age_field">Age:</label><br>
      <select id="age_field" name="age_field">
        <option value="under 18">under 18</option>
        <option value="over 18">over 18</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>My Availability</legend>

      <h3>Days Available:</h3>

      <label for="sunday">Sunday</label>
      <input type="checkbox" id="sunday" name="available_field[]" value="sunday"><br>

      <label for="monday">Monday</label>
      <input type="checkbox" id="monday" name="available_field[]" value="monday"><br>

      <label for="tuesday">Tuesday</label>
      <input type="checkbox" id="tuesday" name="available_field[]" value="tuesday"><br>

      <label for="wednesday">Wednesday</label>
      <input type="checkbox" id="wednesday" name="available_field[]" value="wednesday"><br>

      <label for="thursday">Thursday</label>
      <input type="checkbox" id="thursday" name="available_field[]" value="thursday"><br>

      <label for="friday">Friday</label>
      <input type="checkbox" id="friday" name="available_field[]" value="friday"><br>

      <label for="saturday">Saturday</label>
      <input type="checkbox" id="saturday" name="available_field[]" value="saturday"><br>

      <h3><label for="comments_field">Comments</label></h3>
      <textarea id="comments_field" name="comments_field" rows="3" cols="20"></textarea>
    </fieldset>

    <!-- Replace YourName with your own name (e.g., FirstLast) -->
    <input type="hidden" name="hidden_field" value="OmarSalman">

    <input type="submit" value="Submit Query">
  </form>
</body>
</html>
